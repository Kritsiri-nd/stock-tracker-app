<svg xmlns="http://www.w3.org/2000/svg" width="768" height="315" viewBox="0 0 768 315">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1016"/>
      <stop offset="100%" stop-color="#1a1f27"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Embedded qq.svg -->
  <g transform="translate(25,25) scale(0.3)">
    <!-- Transparent background for flexible use on light/dark navbars -->
  <defs>
    <linearGradient id="gtop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ecc71"/>
      <stop offset="1" stop-color="#1f8f4d"/>
    </linearGradient>
  </defs>

  <!-- Candlestick mascot (simplified) -->
  <g transform="translate(70,50)">
    <!-- Wick -->
    <rect x="60" y="-10" width="16" height="60" rx="8" fill="url(#gtop)"/>
    <!-- Body -->
    <rect x="20" y="40" width="120" height="180" rx="24" fill="#e74c3c" stroke="#141416" stroke-width="8"/>
    <!-- Eyes -->
    <g transform="translate(40,80)">
      <ellipse cx="26" cy="24" rx="22" ry="20" fill="#fff" stroke="#141416" stroke-width="5"/>
      <circle cx="32" cy="26" r="8" fill="#141416"/>
      <ellipse cx="78" cy="24" rx="22" ry="20" fill="#fff" stroke="#141416" stroke-width="5"/>
      <circle cx="72" cy="26" r="8" fill="#141416"/>
      <path d="M8,6 L46,0" stroke="#141416" stroke-width="8" stroke-linecap="round"/>
      <path d="M62,0 L100,6" stroke="#141416" stroke-width="8" stroke-linecap="round"/>
    </g>
    <!-- Smirk -->
    <path d="M40,140 C70,160 98,155 115,140" fill="none" stroke="#141416" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Wordmark (uses system font; you can override with CSS 'font-family') -->
  <g font-family="Inter, Poppins, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800">
    <text x="240" y="140" font-size="140" fill="#ffffff">Chart</text>
    <text x="240" y="260" font-size="140" fill="#2ecc71">Troll</text>
  </g>
  </g>

  <!-- Chaotic green line -->
  <polyline points="80,260 120,230 160,240 200,210 240,200 280,170 320,180 360,150 400,170 440,120 480,130 520,90 560,100 600,70 640,80 680,60 720,75"
    fill="none" stroke="#39FF14" stroke-width="4" filter="url(#glow)" stroke-linecap="round"/>

  <!-- Funny captions -->
  <text x="390" y="70" text-anchor="middle" font-size="24" fill="#FFE066" font-family="Inter, sans-serif" font-weight="700">buy high, panic later 😂</text>
  <text x="120" y="295" font-size="20" fill="#FF6B6B" font-family="Inter, sans-serif" font-weight="600">stonks only go up 🚀</text>
  <text x="520" y="250" font-size="18" fill="#9AE6B4" font-family="Inter, sans-serif" font-weight="600">📊 market chaos: strong bullish vibes</text>

  <!-- Meme face substitute -->
  <text x="720" y="100" text-anchor="middle" font-size="60" fill="#ffffff" opacity="0.9">😎</text>
</svg>